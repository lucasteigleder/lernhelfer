<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernhelfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <aside id="sidebar">
    <div class="brand" data-nav="home">
      <div class="logo">◆</div>
      <div><b>Lernhelfer</b><small>für deine Klassenarbeiten</small></div>
    </div>
    <button class="btn primary full" id="btnNewSubject">＋ Neues Fach</button>
    <div class="side-label">Deine Fächer</div>
    <nav id="subjectList"></nav>
    <div class="side-foot"><div id="apiState"></div>
      <button class="icon-btn" id="btnSettings" style="margin-top:6px;padding:4px 0">⚙ Meine Ausbildung</button></div>
  </aside>

  <main id="main"></main>

  <!-- Dialog: Fach anlegen/bearbeiten -->
  <dialog id="subjectDialog">
    <form method="dialog" id="subjectForm">
      <h2 id="subjectDialogTitle">Neues Fach</h2>
      <label>Fach<input name="name" required maxlength="80" placeholder="z. B. Biologie"></label>
      <label>Thema der Arbeit <span class="muted">(optional, hilft der KI)</span>
        <input name="topic" maxlength="300" placeholder="z. B. Zellbiologie & Mitose"></label>
      <div class="row2">
        <label>Datum der Arbeit<input name="exam_date" type="date"></label>
        <label>Klasse<input name="grade" maxlength="20" placeholder="z. B. 9"></label>
      </div>
      <label>Farbe</label>
      <div class="colors" id="colorPicker"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" value="cancel" id="subjectCancel">Abbrechen</button>
        <button type="submit" class="btn primary" value="ok">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>Meine Ausbildung</h2>
      <p class="muted" style="margin-top:-8px;font-size:13px">Danach richtet die KI das Niveau von Zusammenfassungen, Quiz, Karteikarten und Probeklausuren aus.</p>
      <label>Ausbildung / Schule<input name="profile" maxlength="300" placeholder="z. B. Fachinformatiker für Anwendungsentwicklung, 3. Lehrjahr"></label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="settingsCancel">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="exam.js"></script>
  <script src="app.js"></script>
</body>
</html>
